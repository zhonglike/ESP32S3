; ============================================================
;  ESP32-S3 N16R8 + 板载 WS2812(GPIO46) + ST7789 240x240 双缓冲
;  新建/迁移工程时，整体复制本文件为项目根目录的 platformio.ini
; ============================================================

[env:esp32s3]
platform = espressif32@^6.9.0
board = esp32-s3-devkitc-1
framework = arduino

; ---- N16R8 内存布局：16MB Qio Flash + 8MB OPI PSRAM，缺一不可 ----
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.psram_type = opi
board_build.partitions = default_16MB.csv

; ---- build_flags 说明 ----
;  USB：默认走板上 USB-UART 桥；只有 1 个 USB 口（原生 USB）的板子
;       把 ARDUINO_USB_CDC_ON_BOOT 改为 1
;  TFT_eSPI：以下 -D 项等价于 User_Setup.h，禁止再去改库文件
;    USE_HSPI_PORT    ESP32-S3 必加！S3 上 FSPI 枚举=1 会让 REG_SPI_BASE
;                     解析为 0，开机即 StoreProhibited(0x10) 崩溃循环；
;                     USE_HSPI_PORT 才映射到 GPSPI2 硬件（对齐官方
;                     Setup70h_ESP32_S3_GC9A01，同样的 10/11/12 引脚）
;    CGRAM_OFFSET     240x240 面板必须，否则画面偏移 80 像素
;    TFT_RGB_ORDER    红蓝互换时 BGR <-> RGB
;    TFT_INVERSION_ON 负片/反色时改成 -DTFT_INVERSION_OFF
;    SPI_FREQUENCY    花屏先降 40000000，再不行 20000000
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DUSER_SETUP_LOADED=1
    -DST7789_DRIVER=1
    -DUSE_HSPI_PORT
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=240
    -DCGRAM_OFFSET=1
    -DTFT_MISO=-1
    -DTFT_MOSI=11
    -DTFT_SCLK=12
    -DTFT_CS=10
    -DTFT_DC=14
    -DTFT_RST=15
    -DTFT_BL=16
    -DTFT_RGB_ORDER=TFT_BGR
    -DTFT_INVERSION_ON
    -DSPI_FREQUENCY=80000000

monitor_speed = 115200
upload_speed = 921600
monitor_filters = esp32_exception_decoder

lib_deps =
    bodmer/TFT_eSPI@^2.5.43
    adafruit/Adafruit NeoPixel@^1.12.3

; ---- 换用 Arduino core 3.x（IDF5）时，把顶部 platform 行替换为 ----
;   platform = https://github.com/pioarduino/platform-espressif32.git
; 其余保持不变（Adafruit NeoPixel >= 1.12 才兼容 core 3.x）
